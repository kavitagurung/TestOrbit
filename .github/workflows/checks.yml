name: Validate TestOrbit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest -q
        working-directory: apps/api
