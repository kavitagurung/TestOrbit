name: Daily TestOrbit collection

on:
  schedule:
    # 09:00 Asia/Kolkata (03:30 UTC) every day.
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect public competitor changes
        env:
          SCHEDULER_TOKEN: ${{ secrets.TESTORBIT_SCHEDULER_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST https://testorbit-api.onrender.com/api/v1/admin/collect/daily \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}"
