name: Daily TestOrbit collection

on:
  schedule:
    # The API decides whether the owner-configured IST schedule is due.
    # GitHub Actions can be delayed, so this checks every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check owner-configured collection schedule
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=testorbit-scheduler" | jq --raw-output '.value')"
          test -n "${OIDC_TOKEN}" && test "${OIDC_TOKEN}" != "null"
          curl --fail --silent --show-error \
            -X POST https://testorbit-api.onrender.com/api/v1/admin/collect/scheduled \
            -H "Authorization: Bearer ${OIDC_TOKEN}"
