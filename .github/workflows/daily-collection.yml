name: Daily TestOrbit collection

on:
  schedule:
    # The API decides whether the owner-configured IST schedule is due.
    # GitHub Actions can be delayed, so this checks every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check owner-configured collection schedule
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=testorbit-scheduler" | jq --raw-output '.value')"
          test -n "${OIDC_TOKEN}" && test "${OIDC_TOKEN}" != "null"
          TARGET="https://testorbit-api.onrender.com/api/v1/admin/collect/scheduled"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TARGET="${TARGET}?force=true"; fi
          curl --fail --silent --show-error \
            -X POST "${TARGET}" --output collection-result.json \
            -H "Authorization: Bearer ${OIDC_TOKEN}"
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path("collection-result.json").read_text())
          # Keep credentials and the private schedule out of the public job log.
          print({key: result.get(key) for key in ("ran", "reason", "sources_checked", "failed_sources", "failure_details", "slack_delivered")})
          failures = result.get("failed_sources", []) + result.get("market_discovery", {}).get("failed_providers", [])
          if failures:
              raise SystemExit("Collection incomplete: " + ", ".join(failures))
          PYCODE
