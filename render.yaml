services:
  - type: web
    name: testorbit-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: TEAMS_WEBHOOK_URL
        sync: false
      - key: SCHEDULER_TOKEN
        generateValue: true
      - key: MCP_API_TOKEN
        generateValue: true
